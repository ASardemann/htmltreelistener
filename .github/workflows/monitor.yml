name: Website Monitor

on:
  schedule:
    - cron: "0 3 * * *" # täglich 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Seiten prüfen
        id: monitor
        continue-on-error: true
        env:
          # Gilt für alle Sites
          IGNORE_SELECTORS: ${{ vars.IGNORE_SELECTORS || '.psac-post-slider' }}
          IGNORE_PATTERNS: ${{ vars.IGNORE_PATTERNS }}
          # Site 1
          SITEMAP_URL: ${{ vars.SITEMAP_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Site 2 (optional – weitere Sites analog mit _3, _4, ...)
          SITEMAP_URL_2: ${{ vars.SITEMAP_URL_2 }}
          IGNORE_SELECTORS_2: ${{ vars.IGNORE_SELECTORS_2 }}
          SLACK_WEBHOOK_URL_2: ${{ secrets.SLACK_WEBHOOK_URL_2 }}
          MAIL_TO_2: ${{ secrets.MAIL_TO_2 }}
          # Mail (gemeinsam)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Zustand committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Keine Zustandsänderung"
          else
            git commit -m "chore: update page hashes [skip ci]"
            git push
          fi

      - name: Fehler weiterreichen
        if: steps.monitor.outcome == 'failure'
        run: exit 1
